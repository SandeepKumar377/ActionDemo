name: CI - Environment Neutral

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # allows manually running CI on demand

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 15

    # Change "Development" to whatever your GitHub Environment is actually named
    # (needed here because BUILD_OUTPUT_PATH is an Environment variable)
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'   # Angular 21 requires Node 22.22.0+ (or 24.13.1+)

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Fail fast if build output is empty
        shell: powershell
        env:
          BUILD_OUTPUT_PATH: ${{ vars.BUILD_OUTPUT_PATH }}
        run: |
          $buildOutput = $env:BUILD_OUTPUT_PATH
          if (-not (Test-Path $buildOutput) -or (Get-ChildItem $buildOutput -Recurse -File | Measure-Object).Count -eq 0) {
            throw "Build output '$buildOutput' is missing or empty - failing CI."
          }
          Write-Host "Build output verified at $buildOutput"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: ${{ vars.BUILD_OUTPUT_PATH }}
          retention-days: 5

      - name: CI summary
        shell: powershell
        run: |
          "## CI Build Summary" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Application | ${{ github.event.repository.name }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Artifact | angular-build |" >> $env:GITHUB_STEP_SUMMARY
          "| Run ID | ${{ github.run_id }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Run Number | ${{ github.run_number }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Commit | ${{ github.sha }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Branch | ${{ github.ref_name }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Actor | ${{ github.actor }} |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "> To deploy this build via CD, use **Run ID: ${{ github.run_id }}** and **Artifact: angular-build**" >> $env:GITHUB_STEP_SUMMARY
